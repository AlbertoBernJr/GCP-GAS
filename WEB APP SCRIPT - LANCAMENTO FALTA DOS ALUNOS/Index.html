<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background: #f5f5f5;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      font-size: 1.5rem;
      margin-top: 0;
      color: #333;
    }
    .creditos {
      text-align: left;
      font-size: 0.6rem;
      color: #888;
      margin-top: -10px;
      margin-bottom: 15px;
      font-style: italic;
    }
    .filtros {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }
    @media (max-width: 480px) {
      .filtros {
        grid-template-columns: 1fr;
      }
    }
    .campo-filtro {
      position: relative;
    }
    label {
      font-weight: 600;
      font-size: 0.9rem;
      color: #555;
      display: block;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    .dropdown-opcoes {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      max-height: 200px;
      overflow-y: auto;
      background: white;
      border: 1px solid #ccc;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      z-index: 10;
      display: none;
    }
    .dropdown-opcoes.ativo {
      display: block;
    }
    .opcao {
      padding: 10px;
      cursor: pointer;
      font-size: 0.95rem;
      border-bottom: 1px solid #eee;
    }
    .opcao:hover {
      background: #f0f0f0;
    }
    .botao-limpar {
      width: 100%;
      padding: 10px;
      background: #f5f5f5;
      color: #555;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .botao-limpar:hover {
      background: #e0e0e0;
    }
    .lista {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .aluno-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }
    .aluno-info {
      flex: 1;
      font-size: 0.95rem;
    }
    .bolinha {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid #bbb;
      background: white;
      cursor: pointer;
      transition: all 0.2s;
      margin-left: 12px;
      flex-shrink: 0;
    }
    .bolinha.selecionada {
      background: #2e7d32;
      border-color: #2e7d32;
      box-shadow: 0 0 0 2px rgba(46,125,50,0.2);
    }
    button {
      width: 100%;
      padding: 14px;
      background: #1976d2;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    button:active {
      background: #0d47a1;
    }
    .mensagem {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      display: none;
    }
    .mensagem.sucesso {
      background: #e8f5e9;
      color: #1b5e20;
      display: block;
    }
    .mensagem.erro {
      background: #ffebee;
      color: #b71c1c;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>LANÇAMENTO DE FALTAS</h1>
    <p class="creditos">Desenvolvido por Dailson Freitas & Alberto Bernardo</p>

    <div class="filtros">
      <div class="campo-filtro">
        <label for="filtroRA">RA</label>
        <input type="text" id="filtroRA" placeholder="Digite ou selecione" autocomplete="off">
        <div class="dropdown-opcoes" id="dropdownRA"></div>
      </div>
      <div class="campo-filtro">
        <label for="filtroNome">Nome</label>
        <input type="text" id="filtroNome" placeholder="Digite ou selecione" autocomplete="off">
        <div class="dropdown-opcoes" id="dropdownNome"></div>
      </div>
      <div class="campo-filtro">
        <label for="filtroTurma">Turma</label>
        <input type="text" id="filtroTurma" placeholder="Digite ou selecione" autocomplete="off">
        <div class="dropdown-opcoes" id="dropdownTurma"></div>
      </div>
      <div class="campo-filtro">
        <label for="filtroGrade">Grade</label>
        <input type="text" id="filtroGrade" placeholder="Digite ou selecione" autocomplete="off">
        <div class="dropdown-opcoes" id="dropdownGrade"></div>
      </div>
    </div>

    <button class="botao-limpar" onclick="limparFiltros()">Limpar Filtros</button>

    <ul class="lista" id="listaAlunos"></ul>

    <button onclick="salvar()">SALVAR</button>

    <div id="mensagem" class="mensagem"></div>
  </div>

  <script>
    let todosAlunos = [];
    const selecionados = new Set();

    const filtroRA = document.getElementById('filtroRA');
    const filtroNome = document.getElementById('filtroNome');
    const filtroTurma = document.getElementById('filtroTurma');
    const filtroGrade = document.getElementById('filtroGrade');

    const dropdownRA = document.getElementById('dropdownRA');
    const dropdownNome = document.getElementById('dropdownNome');
    const dropdownTurma = document.getElementById('dropdownTurma');
    const dropdownGrade = document.getElementById('dropdownGrade');

    google.script.run.withSuccessHandler(function(alunos) {
      todosAlunos = alunos;
      atualizarDropdowns();
      filtrarAlunos();
    }).listarAlunos();

    function atualizarDropdowns() {
      const raVal = filtroRA.value.toLowerCase().trim();
      const nomeVal = filtroNome.value.toLowerCase().trim();
      const turmaVal = filtroTurma.value.toLowerCase().trim();
      const gradeVal = filtroGrade.value.toLowerCase().trim();

      const opcoesRA = new Set();
      const opcoesNome = new Set();
      const opcoesTurma = new Set();
      const opcoesGrade = new Set();

      todosAlunos.forEach(aluno => {
        if (
          (!nomeVal || aluno.nome.toLowerCase().includes(nomeVal)) &&
          (!turmaVal || aluno.turma.toLowerCase().includes(turmaVal)) &&
          (!gradeVal || aluno.grade.toLowerCase().includes(gradeVal))
        ) {
          opcoesRA.add(aluno.ra);
        }

        if (
          (!raVal || aluno.ra.toLowerCase().includes(raVal)) &&
          (!turmaVal || aluno.turma.toLowerCase().includes(turmaVal)) &&
          (!gradeVal || aluno.grade.toLowerCase().includes(gradeVal))
        ) {
          opcoesNome.add(aluno.nome);
        }

        if (
          (!raVal || aluno.ra.toLowerCase().includes(raVal)) &&
          (!nomeVal || aluno.nome.toLowerCase().includes(nomeVal)) &&
          (!gradeVal || aluno.grade.toLowerCase().includes(gradeVal))
        ) {
          opcoesTurma.add(aluno.turma);
        }

        if (
          (!raVal || aluno.ra.toLowerCase().includes(raVal)) &&
          (!nomeVal || aluno.nome.toLowerCase().includes(nomeVal)) &&
          (!turmaVal || aluno.turma.toLowerCase().includes(turmaVal))
        ) {
          opcoesGrade.add(aluno.grade);
        }
      });

      preencherDropdown(dropdownRA, [...opcoesRA].sort(), filtroRA);
      preencherDropdown(dropdownNome, [...opcoesNome].sort(), filtroNome);
      preencherDropdown(dropdownTurma, [...opcoesTurma].sort(), filtroTurma);
      preencherDropdown(dropdownGrade, [...opcoesGrade].sort(), filtroGrade);
    }

    function preencherDropdown(dropdown, valores, input) {
      dropdown.innerHTML = '';
      valores.forEach(valor => {
        const div = document.createElement('div');
        div.className = 'opcao';
        div.textContent = valor;
        div.addEventListener('click', function() {
          input.value = valor;
          dropdown.classList.remove('ativo');
          atualizarDropdowns();
          filtrarAlunos();
        });
        dropdown.appendChild(div);
      });
    }

    function filtrarAlunos() {
      const ra = filtroRA.value.toLowerCase().trim();
      const nome = filtroNome.value.toLowerCase().trim();
      const turma = filtroTurma.value.toLowerCase().trim();
      const grade = filtroGrade.value.toLowerCase().trim();

      const filtrados = todosAlunos.filter(aluno => {
        return (
          (!ra || aluno.ra.toLowerCase().includes(ra)) &&
          (!nome || aluno.nome.toLowerCase().includes(nome)) &&
          (!turma || aluno.turma.toLowerCase().includes(turma)) &&
          (!grade || aluno.grade.toLowerCase().includes(grade))
        );
      });

      renderizarLista(filtrados);
    }

    function renderizarLista(alunos) {
      const lista = document.getElementById('listaAlunos');
      lista.innerHTML = '';

      alunos.forEach(aluno => {
        const li = document.createElement('li');
        li.className = 'aluno-item';

        const info = document.createElement('div');
        info.className = 'aluno-info';
        info.innerHTML = `<strong>${aluno.ra}</strong> — ${aluno.nome}<br><small>${aluno.turma} | ${aluno.grade}</small>`;

        const bolinha = document.createElement('button');
        bolinha.className = 'bolinha';
        bolinha.dataset.ra = aluno.ra;
        bolinha.addEventListener('click', function() {
          this.classList.toggle('selecionada');
          if (this.classList.contains('selecionada')) {
            selecionados.add(aluno.ra);
          } else {
            selecionados.delete(aluno.ra);
          }
        });

        li.appendChild(info);
        li.appendChild(bolinha);
        lista.appendChild(li);
      });
    }

    function configurarEventoDropdown(input, dropdown) {
      input.addEventListener('focus', function() {
        dropdown.classList.add('ativo');
        atualizarDropdowns();
      });
      input.addEventListener('input', function() {
        dropdown.classList.add('ativo');
        atualizarDropdowns();
        filtrarAlunos();
      });
      input.addEventListener('blur', function() {
        setTimeout(() => {
          dropdown.classList.remove('ativo');
        }, 200);
      });
    }

    configurarEventoDropdown(filtroRA, dropdownRA);
    configurarEventoDropdown(filtroNome, dropdownNome);
    configurarEventoDropdown(filtroTurma, dropdownTurma);
    configurarEventoDropdown(filtroGrade, dropdownGrade);

    function limparFiltros() {
      filtroRA.value = '';
      filtroNome.value = '';
      filtroTurma.value = '';
      filtroGrade.value = '';
      document.querySelectorAll('.dropdown-opcoes').forEach(d => d.classList.remove('ativo'));
      atualizarDropdowns();
      filtrarAlunos();
    }

    function salvar() {
      if (selecionados.size === 0) {
        mostrarMensagem('Nenhum aluno selecionado.', 'erro');
        return;
      }

      const listaRA = Array.from(selecionados);
      google.script.run
        .withSuccessHandler(function(resultado) {
          mostrarMensagem(
            `Registros salvos: ${resultado.registrados}. Duplicados: ${resultado.duplicados}.`,
            'sucesso'
          );
          selecionados.clear();
          filtrarAlunos();
        })
        .withFailureHandler(function(erro) {
          mostrarMensagem('Erro: ' + erro.message, 'erro');
        })
        .registrarFaltas(listaRA);
    }

    function mostrarMensagem(texto, tipo) {
      const div = document.getElementById('mensagem');
      div.textContent = texto;
      div.className = 'mensagem ' + tipo;
    }
  </script>
</body>
</html>
